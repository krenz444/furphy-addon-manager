[build]
target = "x86_64-pc-windows-gnullvm"

[target.x86_64-pc-windows-gnullvm]
linker = "E:/mingw/llvm-mingw-20260908-ucrt-x86_64/bin/clang.exe"
ar = "E:/mingw/llvm-mingw-20260908-ucrt-x86_64/bin/llvm-ar.exe"
# +crt-static links libunwind statically. Without it the exe imports libunwind.dll,
# which exists only on PCs with llvm-mingw on PATH, so Setup.exe could not start
# anywhere else. tools/check-release-binary.ps1 fails the release if it comes back.
# A RUSTFLAGS environment variable replaces this list entirely; do not set one.
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-Wl,--delayload=WebView2Loader.dll"]
