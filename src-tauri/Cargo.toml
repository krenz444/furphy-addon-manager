[package]
name = "furphy-addon-manager"
version = "2.0.0-dev"
description = "Furphy Addon Manager v2"
authors = ["Eric Krenz"]
edition = "2021"

[lib]
name = "furphy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
winreg = "0.52"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
