[package]
name = "furphy-addon-manager"
version = "2.0.8"
description = "Furphy Addon Manager v2"
authors = ["Eric Krenz"]
edition = "2021"

[lib]
name = "furphy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
winreg = "0.52"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tempfile = "3.10"
sha2 = "0.10"
ring = "0.17"
base64 = "0.22"
windows-sys = { version = "0.52", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security"] }

