<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1350"/>
      <stop offset="55%" stop-color="#1e0f38"/>
      <stop offset="100%" stop-color="#150826"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#fffb96"/>
      <stop offset="38%" stop-color="#ff9ecf"/>
      <stop offset="68%" stop-color="#ff71ce"/>
      <stop offset="100%" stop-color="#b967ff"/>
    </radialGradient>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
    <clipPath id="sunClip">
      <circle cx="256" cy="215" r="150"/>
    </clipPath>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="lineGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <!-- background -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

    <!-- sun -->
    <g clip-path="url(#sunClip)">
      <circle cx="256" cy="215" r="150" fill="url(#sunGrad)"/>
      <rect x="86" y="226" width="340" height="8" fill="#1a0b2e"/>
      <rect x="86" y="244" width="340" height="10" fill="#1a0b2e"/>
      <rect x="86" y="265" width="340" height="13" fill="#1a0b2e"/>
      <rect x="86" y="291" width="340" height="17" fill="#1a0b2e"/>
      <rect x="86" y="322" width="340" height="22" fill="#1a0b2e"/>
      <rect x="86" y="360" width="340" height="26" fill="#1a0b2e"/>
    </g>
    <circle cx="256" cy="215" r="150" fill="none" stroke="#fffb96" stroke-width="3" opacity="0.45"/>

    <!-- perspective grid -->
    <g>
      <line x1="-40" y1="512" x2="256" y2="340" stroke="#01cdfe" stroke-width="2" opacity="0.55"/>
      <line x1="60" y1="512" x2="256" y2="340" stroke="#01cdfe" stroke-width="2" opacity="0.6"/>
      <line x1="160" y1="512" x2="256" y2="340" stroke="#01cdfe" stroke-width="2" opacity="0.65"/>
      <line x1="352" y1="512" x2="256" y2="340" stroke="#01cdfe" stroke-width="2" opacity="0.65"/>
      <line x1="452" y1="512" x2="256" y2="340" stroke="#01cdfe" stroke-width="2" opacity="0.6"/>
      <line x1="552" y1="512" x2="256" y2="340" stroke="#01cdfe" stroke-width="2" opacity="0.55"/>

      <line x1="0" y1="357" x2="512" y2="357" stroke="#01cdfe" stroke-width="1.5" opacity="0.45"/>
      <line x1="0" y1="379" x2="512" y2="379" stroke="#01cdfe" stroke-width="2" opacity="0.55"/>
      <line x1="0" y1="408" x2="512" y2="408" stroke="#01cdfe" stroke-width="2.5" opacity="0.65"/>
      <line x1="0" y1="446" x2="512" y2="446" stroke="#01cdfe" stroke-width="3" opacity="0.75"/>
      <line x1="0" y1="490" x2="512" y2="490" stroke="#01cdfe" stroke-width="3.5" opacity="0.85"/>
    </g>

    <!-- horizon glow -->
    <line x1="0" y1="340" x2="512" y2="340" stroke="#05ffa1" stroke-width="10" opacity="0.5" filter="url(#lineGlow)"/>
    <line x1="0" y1="340" x2="512" y2="340" stroke="#05ffa1" stroke-width="3.5"/>

    <!-- addon glow halo -->
    <path d="M196,220 L226,220 A30,30 0 0 1 286,220 L316,220 A26,26 0 0 1 342,246 L342,366 A26,26 0 0 1 316,392 L196,392 A26,26 0 0 1 170,366 L170,330 A30,30 0 0 0 170,270 L170,246 A26,26 0 0 1 196,220 Z"
          fill="none" stroke="#01cdfe" stroke-width="12" opacity="0.45" filter="url(#softGlow)"/>

    <!-- addon silhouette (puzzle piece) -->
    <path d="M196,220 L226,220 A30,30 0 0 1 286,220 L316,220 A26,26 0 0 1 342,246 L342,366 A26,26 0 0 1 316,392 L196,392 A26,26 0 0 1 170,366 L170,330 A30,30 0 0 0 170,270 L170,246 A26,26 0 0 1 196,220 Z"
          fill="#0c0616" stroke="#01cdfe" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
