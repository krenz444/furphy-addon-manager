<!doctype html>
<html>
<head><meta charset="utf-8"><title>Furphy host selftest</title></head>
<body>
<h1>Furphy host selftest page</h1>
<script>
// Round 15 (E20 - embedded CurseForge pane): this page now loads AS the
// Furphy webview's own content during --selftest (see FurphyHost.cs's
// MainForm_Load), standing in for the real server-hosted SPA - it is
// exercising the page->host messages (contract E) that the host only ever
// honors from that one webview: hello, theme, cf-show, cf-rect, cf-hide,
// cf-nav. Sequence: hello, then a theme message (existing test palette),
// then cf-show (rect + curseforge.com url), then at t=5s a no-op cf-nav
// back followed by cf-hide, then cf-show again at t=5.5s.
//
// The curseforge:// deep-link interception path (HandleCurseforgeProtocol
// -> POST /api/jobs, feeding the marker's `intercepted`/`jobPostStatus`
// fields) is exercised host-side, not from this page: FurphyHost.cs's
// EnsureSelftestDeepLinkInjection injects a script into whatever document
// the CF pane (_cfWebView) loads - i.e. the real curseforge.com page this
// page's own cf-show above navigates it to - which fires a test
// curseforge://install?... link shortly after that document is created.
// CfWebView_NavigationStarting cancels and intercepts it exactly like a
// real "Install" click would.
//
// Round-22 fix (T5): cf-hide was moved from t~3s to t~5s (and the
// trailing cf-show from t=4s to t=5.5s) specifically to stop racing that
// injected script's own fire time - see EnsureSelftestDeepLinkInjection's
// comment in FurphyHost.cs for the full story. Capture (t=7s) and the
// marker write (t=8s) both still have comfortable margin after t=5.5s.
function postToHost(msg) {
    try {
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(msg);
        }
    } catch (e) { }
}

// Listen for the host's own replies (host-ready/cf-state/cf-job) purely
// for host.log visibility during a live run - not required for the
// marker itself, which the host writes from its own state.
try {
    if (window.chrome && window.chrome.webview) {
        window.chrome.webview.addEventListener("message", function (e) {
            try {
                console.log("host->page: " + JSON.stringify(e.data));
            } catch (e2) { }
        });
    }
} catch (e) { }

setTimeout(function () {
    postToHost({ type: "hello" });

    postToHost({
        type: "theme",
        name: "selftest",
        colors: {
            bg0: "#102030", bg1: "#203040", bg2: "#304050", bg3: "#405060",
            border: "#506070", text: "#f0f0f0", muted: "#c0c0c0", accent: "#ff8800"
        }
    });

    postToHost({
        type: "cf-show",
        rect: { x: 300, y: 120, w: 800, h: 600 },
        dpr: 1,
        url: "https://www.curseforge.com/wow/addons"
    });
}, 1000);

setTimeout(function () {
    // No-op: the pane has no back history yet from this one navigation,
    // so this just exercises the message path without changing anything.
    // (Round-22: moved from t=3000 to t=5000 - see the header comment for
    // why: this used to race EnsureSelftestDeepLinkInjection's injected
    // deep-link script.)
    postToHost({ type: "cf-nav", action: "back" });
    postToHost({ type: "cf-hide" });
}, 5000);

setTimeout(function () {
    postToHost({
        type: "cf-show",
        rect: { x: 300, y: 120, w: 800, h: 600 },
        dpr: 1
    });
}, 5500);
</script>
</body>
</html>
